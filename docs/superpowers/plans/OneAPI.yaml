    description: Common related endpoints and models
components:
  parameters:
    region:
      name: region
      in: query
      description: 'The applicable region identifer in [ISO 3166-Alpha-2](https://www.iso.org/obp/ui/#search) format.'
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 2
    limit:
      name: limit
      in: query
      description: The maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    offset:
      name: offset
      in: query
      description: The number of items to discard in this paging operation.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    fromDate:
      name: fromDate
      in: query
      description: The date from which to filter.
      required: true
      schema:
        type: string
        format: date-time
    toDate:
      name: toDate
      in: query
      description: The date to filter up to.
      required: true
      schema:
        type: string
        format: date-time
    siteCode:
      name: siteCode
      in: query
      description: The merchant site code.
      required: false
      schema:
        type: string
    siteCode-required:
      name: siteCode
      in: query
      description: The merchant site code.
      required: true
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: 'The unique key idempotency key as per the following [IETF Draft](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/)'
      schema:
        type: string
    X-Forwarded-For:
      name: X-Forwarded-For
      in: header
      description: The IP address of the end-consumer.
      required: false
      schema:
        type: string
        format: ipv4
    X-Correlation-ID:
      name: X-Correlation-ID
      in: header
