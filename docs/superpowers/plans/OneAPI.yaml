openapi: 3.1.0
info:
  version: '1.0'
  title: One API
  summary: The One API to rule them all
  description: Ozow OneAPI encompassing all REST API integrations possible with Ozow.
  termsOfService: 'https://ozow.com/terms-and-conditions'
  contact:
    name: Ozow Support
    url: 'https://ozow.com'
    email: support@ozow.com
servers:
  - url: 'https://one.ozow.com/v1'
paths:
  /token:
    post:
      tags:
        - authentication
      summary: Generate Authentication Token
      description: 'Retrieve an authentication token as per the [OpenAuth 2.0 Client Credential Flow](https://datatracker.ietf.org/doc/html/rfc6749#section-4.4).'
      operationId: post-token
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: 'Succesfull response as per [RFC 6749](https://datatracker.ietf.org/doc/html/rfc6749#section-5.1)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      servers:
        - url: 'https://one.ozow.com/v1'
  /paymentmethods:
    get:
      tags:
        - payments
      summary: Get Payment Methods
      description: 'Retrieve the list of payment methods available.  If  `region` is not specified, IP geolocation will be used to determine an applicable region.'
      operationId: get-paymentmethods
      parameters:
        - $ref: '#/components/parameters/X-Forwarded-For'
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/siteCode-required'
        - $ref: '#/components/parameters/region'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                    description: Links for pagination
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                    description: The pagination meta data available.
                required:
                  - links
                  - results
                  - meta
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  /bankaccount/verify:
    post:
      tags:
        - bankaccount
      summary: Bank Account Verification
      operationId: post-bankaccount-verify
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountVerificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountVerificationResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountVerificationResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  /regions:
    get:
      tags:
        - payments
      summary: Get Regions
      description: Retreives a list of regions available for payment.
      operationId: get-regions
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                    description: Links for use in pagination.
                  results:
                    type: array
                    description: The list of regions.
                    items:
                      $ref: '#/components/schemas/Region'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                    description: The pagination meta data available.
                required:
                  - links
                  - results
                  - meta
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  /payments:
    post:
      tags:
        - payments
      summary: Request Payment
      description: Create a payment request with the specified channel and transaction details.
      operationId: post-payments
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - $ref: '#/components/parameters/X-Correlation-ID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
            Location:
              schema:
                type: string
                format: uri
              description: The unique URI for this resource.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
    get:
      tags:
        - payments
      summary: List Payments
      description: List payments between specific dates.
      operationId: get-payments
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/siteCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                    description: The links used in pagination.
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required:
                  - links
                  - results
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  '/payments/{id}':
    get:
      tags:
        - payments
      summary: Get Payment Status by Id
      description: Retrieves the details of a payment request.
      operationId: get-payments-id
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The unique identifier of the payment.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  '/payments/{id}/cancel':
    post:
      tags:
        - payments
      summary: Cancel Payment Request
      description: Cancels the payment request with the specified `id`.
      operationId: post-payments-id-cancel
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The unique identifier of the payment.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      responses:
        '200':
          description: OK. The payment has been cancelled.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '201':
          description: Created. The payment has been cancelled
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  '/payments/{id}/transactions':
    get:
      tags:
        - payments
      summary: List Transactions for Payment
      description: List the transactions associated with the payment request with the specified `id`.
      operationId: get-payments-transactions
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - name: id
          in: path
          description: The unique identifier of the payment.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
    post:
      tags:
        - payments
      summary: Request Transaction for Payment
      operationId: post-payments-id-transactions
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/Idempotency-Key'
        - name: id
          in: path
          description: The unique identifier of the payment.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDetail'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
                  requiredActionOptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequiredAction'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
                  requiredActionOptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequiredAction'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - payment
      servers:
        - url: 'https://one.ozow.com/v1'
  /refunds:
    get:
      tags:
        - refunds
      summary: List Refunds
      description: Retrieve a list of refunds performed.
      operationId: get-refunds
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/siteCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundList'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
    post:
      tags:
        - refunds
      summary: Request Refunds
      description: Request refunds for the specified transactions.
      operationId: post-refunds
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - $ref: '#/components/parameters/X-Correlation-ID'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: OK. The refund has been accepted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refund'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '201':
          description: Created.  The refund has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
  '/refunds/{id}':
    get:
      tags:
        - refunds
      summary: Get Refund
      description: Retrieve a refund by its unique identifier.
      operationId: get-refunds-id
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The refund identifier.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
  '/refunds/{id}/cancel':
    post:
      tags:
        - refunds
      summary: Cancel Refund
      description: Cancels the refund with the specified identifier if possible.
      operationId: post-refunds-id-cancel
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The refund identifier.
          required: true
          schema:
            type: string
            format: uuid
            examples:
              - 497f6eca-6276-4993-bfeb-53cbbbba6f08
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: The reason for the refund cancellation.
              required:
                - reason
      responses:
        '200':
          description: OK. The refund has been cancelled.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '201':
          description: Created.  The refund has been cancelled
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
  '/refunds/{id}/notifications':
    get:
      tags:
        - refunds
        - webhooks
      summary: Get Refund Notifications
      description: Gets the refund notifications.
      operationId: get-refunds-id-notifications
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The refund identifier.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookMessageStatus'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
  '/refunds/{id}/notifications/resend':
    post:
      tags:
        - refunds
        - webhooks
      summary: Resend Refund Notifications
      description: Resend the notifications for the refund.
      operationId: post-refunds-id-notifications-resend
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The refund identifier.
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted.
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - refund
      servers:
        - url: 'https://one.ozow.com/v1'
  /settlements:
    get:
      tags:
        - settlements
      summary: List Settlements
      description: Retrieve a list of settlements.
      operationId: get-settlements
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/siteCode'
        - name: reference
          in: query
          description: The settlement reference.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementList'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - Authentication:
            - settlements
      servers:
        - url: 'https://one.ozow.com/v1'
  '/settlements/{id}':
    get:
      tags:
        - settlements
      summary: Get Settlement
      description: Retrieve a settlement by it's unique identifier.
      operationId: get-settlements-id
      parameters:
        - $ref: '#/components/parameters/X-Correlation-ID'
        - name: id
          in: path
          description: The settlement identifier.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        '400':
